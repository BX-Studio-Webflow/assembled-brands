# Continuous deployment for the intake app (backend worker + Vercel frontend).
#
# ⚠️ ACTIVATION: GitHub Actions only runs workflows from `.github/workflows` at
# the REPOSITORY ROOT. This file lives under `assembled_brands/app/` for now;
# move it (and ci.yml) to the chosen release repo's root to activate, and set
# the repository secrets listed below.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN      - token with Workers + D1 + R2 edit on the account
#   CLOUDFLARE_ACCOUNT_ID     - e8a9920aa94111ca60571c30408287d9
#   PROD_WORKER_VARS_JSON     - full JSON of prod worker vars (mirrors secrets/production.vars.json)
#   VERCEL_TOKEN              - Vercel access token
#   VERCEL_ORG_ID             - team_Bn37JBQxmGDRXTANK0FDnkqO
#   VERCEL_PROJECT_ID         - prj_gJ8WuZEwiLy1ZzouLlcbw4gEcJia

name: Deploy

on:
  push:
    branches: [main]
    paths: ['app/**']
  workflow_dispatch:
    inputs:
      run_migrations:
        description: 'Apply prod D1 migrations before deploying'
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/packages/server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.11.1 }
      - uses: actions/setup-node@v4
        with: { node-version: '22.x', cache: pnpm }
      - run: pnpm install --no-frozen-lockfile
        working-directory: app
      - run: pnpm check

      # Materialize the var file the deploy script reads (never committed).
      - name: Write prod vars
        run: |
          mkdir -p secrets
          printf '%s' "$PROD_WORKER_VARS_JSON" > secrets/production.vars.json
        env:
          PROD_WORKER_VARS_JSON: ${{ secrets.PROD_WORKER_VARS_JSON }}

      - name: Apply migrations (manual dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.run_migrations
        run: npx wrangler d1 migrations apply DB --env production --remote

      - name: Deploy worker
        run: pnpm deploy:production

  frontend:
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: app/webapp
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.11.1 }
      - uses: actions/setup-node@v4
        with: { node-version: '22.x', cache: pnpm }
      - run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
